name: Portfolio Preview Build

on:
  push:
    branches:
      - design/mahin-inspired-editorial-v3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Build Next.js application
        run: npm run build
